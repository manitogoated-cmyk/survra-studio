name: Survra quality test render (no upload)

# Renders one episode with the current branch's engine and keeps the video as an artifact for review.
# Never uploads, never touches publish/ledger.json, never commits. Triggered by editing quality/render-test.json.
on:
  push:
    branches: [quality-upgrade]
    paths: ["quality/render-test.json"]
  workflow_dispatch:

concurrency:
  group: survra-quality-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cfg:
    if: github.repository == 'manitogoated-cmyk/survra-studio'
    runs-on: ubuntu-latest
    outputs:
      ep: ${{ steps.c.outputs.ep }}
      parts: ${{ steps.c.outputs.parts }}
      n: ${{ steps.c.outputs.n }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          ep=$(python3 -c "import json;print(json.load(open('quality/render-test.json'))['episode'])")
          n=$(python3 -c "import json;print(json.load(open('quality/render-test.json')).get('parts',14))")
          echo "ep=$ep" >> "$GITHUB_OUTPUT"; echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "parts=$(python3 -c "print(list(range($n)))")" >> "$GITHUB_OUTPUT"

  voice:
    needs: cfg
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-inter libegl1 libgl1 libfontconfig1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.1-timed
      - run: |
          mkdir -p models
          [ -f models/kokoro-v1.0.timed.onnx ] || curl -fsSL -o models/kokoro-v1.0.timed.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -fsSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ln -sf kokoro-v1.0.timed.onnx models/kokoro-v1.0.onnx
      - env:
          EP: ${{ needs.cfg.outputs.ep }}
        run: python3 engine3/voice3.py "episodes/$EP/script.json" "episodes/$EP/build"
      - uses: actions/upload-artifact@v4
        with:
          name: qvoice
          path: |
            episodes/${{ needs.cfg.outputs.ep }}/build/timeline.json
            episodes/${{ needs.cfg.outputs.ep }}/build/voice.wav
          retention-days: 2

  frames:
    needs: [cfg, voice]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.cfg.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q fonts-inter libegl1 libgl1 libfontconfig1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt bpy==5.3.0
      - uses: actions/download-artifact@v4
        with:
          name: qvoice
          path: episodes/${{ needs.cfg.outputs.ep }}/build
      - env:
          EP: ${{ needs.cfg.outputs.ep }}
          PART: ${{ matrix.part }}
          N: ${{ needs.cfg.outputs.n }}
        run: |
          nproc
          python3 -u engine4/kit3d.py "episodes/$EP" all "$PART" "$N" 2>&1 | grep --line-buffered -v -E "^Fra:|Fontconfig"
      - uses: actions/upload-artifact@v4
        with:
          name: qframes-${{ matrix.part }}
          path: episodes/${{ needs.cfg.outputs.ep }}/build/3d
          retention-days: 2

  composite:
    needs: [cfg, frames]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-inter libegl1 libgl1 libfontconfig1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: qvoice
          path: episodes/${{ needs.cfg.outputs.ep }}/build
      - uses: actions/download-artifact@v4
        with:
          pattern: qframes-*
          merge-multiple: true
          path: episodes/${{ needs.cfg.outputs.ep }}/build/3d
      - env:
          EP: ${{ needs.cfg.outputs.ep }}
        run: |
          ls "episodes/$EP/build/3d" | wc -l
          PRERENDERED=1 bash engine3/make_episode.sh "episodes/$EP" || echo "QC or build step reported a failure (see qc.json)"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -of compact "episodes/$EP/$EP.mp4" || true
          cat "episodes/$EP/build/qc.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-test-${{ needs.cfg.outputs.ep }}
          path: |
            episodes/${{ needs.cfg.outputs.ep }}/*.mp4
            episodes/${{ needs.cfg.outputs.ep }}/build/qc.json
            episodes/${{ needs.cfg.outputs.ep }}/build/edl.json
          retention-days: 3
