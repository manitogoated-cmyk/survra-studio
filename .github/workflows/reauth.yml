name: Survra re-authorize (temporary)

# One-off helper: exchanges a Google authorization code (stored briefly as the YT_AUTH_CODE secret) for a new
# refresh token using the client secret that only lives in GitHub secrets. The token is printed ONLY encrypted
# with the RSA public key passed in, so the public log never shows it. Removed again after use.
on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: "Base64 of an RSA public key (PEM)"
        required: true

permissions:
  contents: read

jobs:
  exchange:
    if: github.repository == 'manitogoated-cmyk/survra-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q requests cryptography
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          CODE: ${{ secrets.YT_AUTH_CODE }}
          VERIFIER: ${{ secrets.YT_PKCE_VERIFIER }}
          PUBKEY: ${{ inputs.pubkey }}
        run: |
          python3 - <<'EOF'
          import base64, os, requests
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          r = requests.post("https://oauth2.googleapis.com/token", data=dict(
              code=os.environ["CODE"], client_id=os.environ["YT_CLIENT_ID"], client_secret=os.environ["YT_CLIENT_SECRET"],
              redirect_uri="http://127.0.0.1:8765", grant_type="authorization_code", code_verifier=os.environ["VERIFIER"]), timeout=30)
          if r.status_code != 200:
              print("EXCHANGE_FAILED", r.status_code, r.json().get("error"), r.json().get("error_description")); raise SystemExit(1)
          t = r.json()
          print("SCOPES", t.get("scope"))
          ch = requests.get("https://www.googleapis.com/youtube/v3/channels", params=dict(part="id,snippet", mine="true"),
                            headers={"Authorization": "Bearer " + t["access_token"]}, timeout=30).json()
          for c in ch.get("items", []): print("CHANNEL", c["id"], c["snippet"]["title"])
          key = serialization.load_pem_public_key(base64.b64decode(os.environ["PUBKEY"]))
          ct = key.encrypt(t["refresh_token"].encode(), padding.OAEP(mgf=padding.MGF1(hashes.SHA256()), algorithm=hashes.SHA256(), label=None))
          print("CIPHERTEXT", base64.b64encode(ct).decode())
          EOF
