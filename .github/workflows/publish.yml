name: Survra daily publish

on:
  schedule:
    - cron: "17 9 * * *"        # daily 09:17 UTC; videos are scheduled into slots, not posted now
  workflow_dispatch:
    inputs:
      only:
        description: "Episode id to process (blank = all ready episodes)"
        required: false
      dry_run:
        description: "Render + QC only, never upload"
        type: boolean
        default: false

concurrency:
  group: survra-publish          # never two uploaders at once (duplicate protection)
  cancel-in-progress: false

permissions:
  contents: write                # commit publish/ledger.json back
  issues: write                  # open an issue when re-authorization is needed

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Pause switch
        id: pause
        run: |
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('publish/config.json')).get('paused') else 1)"; then
            echo "paused=true" >> "$GITHUB_OUTPUT"; echo "Publishing is PAUSED (publish/config.json)."
          fi

      - name: System packages
        if: steps.pause.outputs.paused != 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-inter libegl1 libgl1 libfontconfig1

      - uses: actions/setup-python@v5
        if: steps.pause.outputs.paused != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Python packages
        if: steps.pause.outputs.paused != 'true'
        run: pip install -r requirements.txt

      - name: Voice model cache
        if: steps.pause.outputs.paused != 'true'
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Download voice model (Apache-2.0)
        if: steps.pause.outputs.paused != 'true'
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f models/kokoro-v1.0.onnx ] || curl -fsSL -o models/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ]  || curl -fsSL -o models/voices-v1.0.bin  $base/voices-v1.0.bin

      - name: Render, QC and upload
        id: run
        if: steps.pause.outputs.paused != 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set +e
          args=""
          [ -n "${{ inputs.only }}" ] && args="$args --only ${{ inputs.only }}"
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          python3 publish/publisher.py $args 2>&1 | tee publish.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Keep rendered videos for review (14 days)
        if: always() && steps.pause.outputs.paused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: renders-${{ github.run_number }}
          path: |
            episodes/*/*.mp4
            episodes/*/build/qc.json
            publish.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit ledger
        if: always() && steps.pause.outputs.paused != 'true'
        run: |
          git config user.name "survra-bot"
          git config user.email "survra-bot@users.noreply.github.com"
          git add publish/ledger.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "ledger: uploads from run ${{ github.run_number }}" && git push)

      - name: Ask for re-authorization
        if: steps.run.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Survra: YouTube authorization expired" \
            --body "The upload token for the Survra channel expired or was revoked. Nothing was uploaded. Ask Claude to re-authorize the Survra account and update the YT_REFRESH_TOKEN secret."

      - name: Fail the run on errors
        if: steps.run.outputs.code != '0' && steps.run.outputs.code != ''
        run: exit 1
