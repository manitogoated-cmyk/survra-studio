name: Survra daily publish

on:
  schedule:
    - cron: "17 9 * * *"        # daily 09:17 UTC; videos are scheduled into slots, not posted at this time
  workflow_dispatch:
    inputs:
      only:
        description: "Episode id to process (blank = every ready episode)"
        required: false
      dry_run:
        description: "Render + QC only, never upload"
        type: boolean
        default: false

concurrency:
  group: survra-publish          # never two pipelines at once (duplicate protection)
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  plan:
    # Public repo: only the owner's copy may run (forks never get secrets anyway).
    if: github.repository == 'manitogoated-cmyk/survra-studio'
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.p.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then ids=$(python3 publish/publisher.py plan --only "$ONLY"); else ids=$(python3 publish/publisher.py plan); fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"; echo "queue: $ids"

  voice:
    # Rook's narration + phoneme timings, made once so every frame job lip-syncs to the same audio.
    needs: plan
    if: needs.plan.outputs.ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-inter libegl1 libgl1 libfontconfig1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.1-timed
      - name: Download voice model (Kokoro-82M, Apache-2.0)
        run: |
          mkdir -p models
          [ -f models/kokoro-v1.0.timed.onnx ] || curl -fsSL -o models/kokoro-v1.0.timed.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -fsSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ln -sf kokoro-v1.0.timed.onnx models/kokoro-v1.0.onnx
      - env:
          EP: ${{ matrix.id }}
        run: |
          [ -f "episodes/$EP/scenes.py" ] || exit 0
          python3 engine3/voice3.py "episodes/$EP/script.json" "episodes/$EP/build"
      - uses: actions/upload-artifact@v4
        with:
          name: voice-${{ matrix.id }}
          path: |
            episodes/${{ matrix.id }}/build/timeline.json
            episodes/${{ matrix.id }}/build/voice.wav
          retention-days: 3
          if-no-files-found: ignore

  frames:
    # 3D animation: Blender (bpy) + Cycles on CPU. Each episode's frames are split across 6 parallel jobs.
    needs: [plan, voice]
    if: needs.plan.outputs.ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
        part: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - id: has
        env:
          EP: ${{ matrix.id }}
        run: if [ -f "episodes/$EP/world3d.py" ]; then echo "is3d=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.has.outputs.is3d == '1'
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-inter libegl1 libgl1 libfontconfig1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6
      - if: steps.has.outputs.is3d == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - if: steps.has.outputs.is3d == '1'
        run: pip install -r requirements.txt bpy==5.3.0
      - if: steps.has.outputs.is3d == '1'
        uses: actions/download-artifact@v4
        with:
          name: voice-${{ matrix.id }}
          path: episodes/${{ matrix.id }}/build
      - if: steps.has.outputs.is3d == '1'
        env:
          EP: ${{ matrix.id }}
          PART: ${{ matrix.part }}
        run: |
          nproc; free -g | head -2
          python3 -u engine4/kit3d.py "episodes/$EP" all "$PART" 6 2>&1 | grep --line-buffered -v -E "^Fra:|Fontconfig"
      - if: steps.has.outputs.is3d == '1'
        uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.id }}-${{ matrix.part }}
          path: episodes/${{ matrix.id }}/build/3d
          retention-days: 3

  render:
    # Composite: 3D frames + captions, HUD, transitions, 2D inserts -> sound design -> QC gate -> packaging.
    needs: [plan, frames]
    if: ${{ !cancelled() && needs.plan.outputs.ids != '[]' && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false           # one bad episode never blocks the others
      max-parallel: 6
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-inter libegl1 libgl1 libfontconfig1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.1-timed
      - name: Download voice model (legacy 2D episodes only)
        run: |
          mkdir -p models
          [ -f models/kokoro-v1.0.timed.onnx ] || curl -fsSL -o models/kokoro-v1.0.timed.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -fsSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ln -sf kokoro-v1.0.timed.onnx models/kokoro-v1.0.onnx
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: voice-${{ matrix.id }}
          path: episodes/${{ matrix.id }}/build
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: frames-${{ matrix.id }}-*
          merge-multiple: true
          path: episodes/${{ matrix.id }}/build/3d
      - name: Composite, sound, QC gate, packaging
        env:
          EP: ${{ matrix.id }}
        run: |
          if [ -f "episodes/$EP/build/3d/manifest.json" ]; then export PRERENDERED=1; fi
          ls "episodes/$EP/build/3d" 2>/dev/null | wc -l
          python3 publish/publisher.py render --only "$EP"
      - name: Review copy (small) on the renders-<episode> branch
        if: always()
        env:
          EP: ${{ matrix.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "episodes/$EP/$EP.mp4" ] || exit 0
          mkdir -p /tmp/rv
          ffmpeg -y -loglevel error -i "episodes/$EP/$EP.mp4" -vf "scale='if(gt(iw,ih),960,540)':-2" -c:v libx264 -crf 27 -preset veryfast -c:a aac -b:a 96k "/tmp/rv/$EP.mp4"
          cp "episodes/$EP/build/qc.json" "/tmp/rv/$EP.qc.json" 2>/dev/null || true
          cp "episodes/$EP/build/thumbnail.jpg" "/tmp/rv/$EP.thumb.jpg" 2>/dev/null || true
          cd /tmp/rv && git init -q -b "renders-$EP" && git config user.name "survra-bot" && git config user.email "survra-bot@users.noreply.github.com"
          git add -A && git commit -qm "review copy of $EP (run ${{ github.run_number }})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "renders-$EP" || true
      - name: Keep the result (video, QC report, captions, thumbnail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ matrix.id }}
          path: |
            episodes/${{ matrix.id }}/*.mp4
            episodes/${{ matrix.id }}/build/qc.json
            episodes/${{ matrix.id }}/build/captions.srt
            episodes/${{ matrix.id }}/build/thumbnail.jpg
            qc/fingerprints/${{ matrix.id }}.npz
          retention-days: 14
          if-no-files-found: ignore

  publish:
    needs: [plan, render]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - uses: actions/download-artifact@v4
        with:
          pattern: episode-*
          path: _art
      - name: Put rendered files back in place
        run: |
          shopt -s nullglob
          for d in _art/episode-*; do id=${d#_art/episode-}; cp -r "$d"/. . 2>/dev/null || true; echo "restored $id"; done
          find episodes -name '*.mp4' | head -20
      - name: Upload to YouTube
        id: up
        if: needs.plan.outputs.ids != '[]' && inputs.dry_run != true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ONLY: ${{ inputs.only }}
        run: |
          set +e
          if [ -n "$ONLY" ]; then python3 publish/publisher.py upload --only "$ONLY"; else python3 publish/publisher.py upload; fi
          echo "code=$?" >> "$GITHUB_OUTPUT"; exit 0
      - name: Update ledger, originality fingerprints and dashboard
        run: |
          python3 publish/publisher.py status
          git config user.name "survra-bot"; git config user.email "survra-bot@users.noreply.github.com"
          git add publish/ledger.json STATUS.md qc/fingerprints 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "pipeline: run ${{ github.run_number }}" && git pull --rebase -q && git push)
      - name: Ask for re-authorization
        if: steps.up.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Survra: YouTube authorization expired" \
            --body "The upload token for the Survra channel expired or was revoked. Nothing was uploaded. Ask Claude to re-authorize the Survra account and update the YT_REFRESH_TOKEN secret."
      - name: Fail the run on errors
        if: (steps.up.outputs.code != '0' && steps.up.outputs.code != '') || needs.render.result == 'failure'
        run: exit 1
